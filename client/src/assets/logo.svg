<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Hexagonal / Node Shield -->
  <rect x="8" y="8" width="84" height="84" rx="24" fill="#0F172A" stroke="url(#brandGrad)" stroke-width="3" />
  
  <!-- Adaptive Node Links -->
  <path d="M26 68 L44 34 L62 56 L76 28" stroke="url(#brandGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Adaptive Nodes -->
  <circle cx="26" cy="68" r="6" fill="#06B6D4" />
  <circle cx="44" cy="34" r="7" fill="#6366F1" />
  <circle cx="62" cy="56" r="6" fill="#818CF8" />
  <circle cx="76" cy="28" r="8" fill="#10B981" filter="url(#glow)" />
</svg>
